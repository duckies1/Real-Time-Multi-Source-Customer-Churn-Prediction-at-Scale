services:
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: churn-namenode
    environment:
      CLUSTER_NAME: churn-lake
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
    ports: ["9870:9870", "9000:9000"]
    volumes:
      - hdfs_namenode:/hadoop/dfs/name
      - ./dataset:/dataset:ro
      - ./artifacts:/artifacts
    networks: [churn]
  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    environment:
      SERVICE_PRECONDITION: namenode:9870
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
    volumes: [hdfs_datanode:/hadoop/dfs/data]
    depends_on: [namenode]
    networks: [churn]
  kafka:
    image: apache/kafka:3.7.2
    container_name: churn-kafka
    hostname: kafka
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: CONTROLLER://:29093,PLAINTEXT://:29092,PLAINTEXT_HOST://:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    networks: [churn]
  spark:
    build: ./spark
    container_name: churn-spark
    user: root
    depends_on: [namenode, kafka]
    volumes:
      - ./dataset:/dataset:ro
      - ./app:/app:ro
      - ./artifacts:/artifacts
    networks: [churn]
    entrypoint: ["/bin/bash", "-lc", "tail -f /dev/null"]
  inference-api:
    build: ./spark
    container_name: churn-inference-api
    user: root
    depends_on: [namenode, kafka]
    volumes:
      - ./app:/app:ro
    environment:
      SPARK_HOME: /opt/spark
      PYTHONPATH: /opt/spark/python:/opt/spark/python/lib/py4j-0.10.9.7-src.zip
      SPARK_MASTER: local[2]
      MODEL_PATH: hdfs://namenode:9000/churn/slice-100mb/models/churn-rf
      FEATURES_PATH: hdfs://namenode:9000/churn/slice-100mb/features/train
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_PREDICTIONS_TOPIC: churn-ui-predictions
      CORS_ORIGINS: "*"
    ports: ["8000:8000"]
    networks: [churn]
    command: ["/bin/bash", "-lc", "cd /app && python3 -m uvicorn inference_api:app --host 0.0.0.0 --port 8000"]
volumes:
  hdfs_namenode:
  hdfs_datanode:
networks:
  churn:
